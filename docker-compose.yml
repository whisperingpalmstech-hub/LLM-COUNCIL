services:
  synod:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    depends_on:
      - anythingllm
    networks:
      - synod_network

  anythingllm:
    image: mintplexlabs/anythingllm
    ports:
      - "3001:3001"
    volumes:
      - ./data/anythingllm_storage:/app/server/storage
    environment:
      - STORAGE_DIR=/app/server/storage
      - SERVER_PORT=3001
    networks:
      - synod_network

networks:
  synod_network:
    driver: bridge
