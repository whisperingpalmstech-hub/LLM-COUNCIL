services:
  synod:
    build: .
    init: true
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    environment:
      # Inside Docker, "localhost" is this container; reach AnythingLLM by service name.
      ANYTHINGLLM_BASE_URL: ${ANYTHINGLLM_DOCKER_BASE_URL:-http://anythingllm:3001}

  # Optional: only needed if council members use the "anythingllm" provider.
  # Start with: docker compose --profile anythingllm up
  anythingllm:
    image: mintplexlabs/anythingllm
    profiles: ["anythingllm"]
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      - ./data/anythingllm_storage:/app/server/storage
    environment:
      - STORAGE_DIR=/app/server/storage
      - SERVER_PORT=3001
